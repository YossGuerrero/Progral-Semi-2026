<form id="frmBusquedaAlumno" name="frmBusquedaAlumno">
    <div class="card theme-secondary">
        style="min-width:700px">
        <div class="card-header">
            <div class="d-flex">
                Administracion de Alumnos

                <div class="ms-auto">
                    <button data-ng-form="button" type="button" class="btn-close" aria-label="Close"></button>
                </div>
            </div>
            <div class="card-body">
                <div class="row p-1">
                    <div class="col-3 col-md-2">CODIGO</div>
                    <div class="col-9 col-md-4">
                        <input type="text" class="form-control" id="txtCodigoAlumno" name="txtCodigoAlumno" />
                    </div>
                </div>
                <div class="row p-1">
                    <div class="col-3 col-md-2">NOMBRE</div>
                    <div class="col-9 col-md-8">
                        <input type="text" class="form-control" id="txtNombreAlumno" name="txtNombreAlumno" />
                    </div>
                </div>
                <div class="row p-1">
                    <div class="col-3 col-md-2">DIRECCION</div>
                    <div class="col-9 col-md-10">
                        <input type="text" class="form-control" id="txtDireccionAlumno" name="txtDireccionAlumno" />
                    </div>
                </div>
                <div class="row p-1">
                    <div class="col-3 col-md-2">TELEFONO</div>
                    <div class="col-9 col-md-8">
                        <input type="text" class="form-control" id="txtTelefonoAlumno" name="txtTelefonoAlumno" />
                    </div>
                </div>
                <div class="row p-1">
                    <div class="col-3 col-md-2">EMAIL</div>
                    <div class="col-9 col-md-10">
                        <input type="text" class="form-control" id="txtEmailAlumno" name="txtEmailAlumno" />
                    </div>
                </div>
            </div>
           <div class="card-body">
               <table id=""cellpadding="tblConsultaAlumnos" class="table table-striped table-hover">
                   <thead>
                       <tr>
                           <th colspan="6">
                                <input type="search" class="form-control" placeholder="Buscar alumnos por codigo, nombre"
                                       name="txtBuscarAlumno" id="txtBuscarAlumno" />
                           </th>
                       </tr>
                       <tr>
                           <th>CODIGO</th>
                           <th>NOMBRE</th>
                           <th>DIRECCION</th>
                           <th>TELEFONO</th>
                           <th>EMAIL</th>
                           <th></th>
                       </tr>
                       </thead>
                       <tbody></tbody>
                   </table>

               </div>
           </div>
        </div>
</form>
<script>
    txtBuscarAlumno.addEventListener('keyup', e => {
        listarAlumnos(txtBuscarAlumno.value);
    });
    async function listarAlumnos(buscar'') {
        let alumno = await obtenerAlumnos(buscar),
            filas = '';
        alumnos, forEach(alumno => {
            filas += `<tr>
                        <td>${alumno.codigo}</td>
                        <td>${alumno.nombre}</td>
                        <td>${alumno.direccion}</td>
                        <td>${alumno.telefono}</td>
                        <td>${alumno.email}</td>
                        <td></td>
                    </tr>`
            ;
        });
        document.querySelector("#tblConsultaAlumnos > tbody").innerHTML = filas;
    }
</script>
